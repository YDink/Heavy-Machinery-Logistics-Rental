version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/platform/database/queries.sql"
    schema: "../migrations/"
    gen:
      go:
        package: "db"
        out: "internal/platform/database/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
