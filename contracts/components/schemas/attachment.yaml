AttachmentPhotoInput:
  type: object
  required: [angle, storageUri]
  properties:
    angle:
      type: string
      enum: [OVERALL, BRACKET, PINS, TOOL_TIP]
    storageUri:
      type: string

CreateAttachmentRequest:
  type: object
  required:
    - attachmentType
    - make
    - model
    - subTypeSize
    - serialNumber
    - operatingWeightKg
    - minCarrierWeightTonnes
    - maxCarrierWeightTonnes
    - requiredFlowMinLmin
    - requiredFlowMaxLmin
    - requiredPressureBar
    - pinDiameterMm
    - pinSpreadMm
    - compatibleSubcategories
    - standaloneDailyRateMinor
  properties:
    attachmentType:
      type: string
      enum: [HYDRAULIC_BREAKER, STANDARD_BUCKET, TRENCHING_BUCKET, AUGER, RIPPER_TOOTH, SORTING_GRAPPLE, CRUSHER]
    make:
      type: string
    model:
      type: string
    subTypeSize:
      type: string
    serialNumber:
      type: string
    operatingWeightKg:
      type: number
    minCarrierWeightTonnes:
      type: number
    maxCarrierWeightTonnes:
      type: number
    requiredFlowMinLmin:
      type: number
    requiredFlowMaxLmin:
      type: number
    requiredPressureBar:
      type: number
    pinDiameterMm:
      type: number
    pinSpreadMm:
      type: number
    compatibleSubcategories:
      type: array
      items:
        type: string
    standaloneDailyRateMinor:
      type: integer
      format: int64
    securityDepositMinor:
      type: integer
      format: int64
      default: 0
    minRentalDays:
      type: integer
      default: 1
    photos:
      type: array
      items:
        $ref: '#/AttachmentPhotoInput'

AttachmentResponseData:
  type: object
  required: [attachmentId, status, attachmentType, make, model, standaloneDailyRateMinor, createdAt]
  properties:
    attachmentId:
      type: string
      format: uuid
    status:
      type: string
      enum: [DRAFT, ACTIVE, RENTED, MAINTENANCE_HOLD, INACTIVE, DISPUTED_DAMAGE, DECOMMISSIONED]
    attachmentType:
      type: string
    make:
      type: string
    model:
      type: string
    standaloneDailyRateMinor:
      type: integer
      format: int64
    createdAt:
      type: string
      format: date-time

AttachmentSuccessResponse:
  type: object
  required: [success, data, error, meta]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/AttachmentResponseData'
    error:
      type: object
      nullable: true
      default: null
    meta:
      $ref: './common.yaml#/ResponseMeta'

AttachmentInventoryItem:
  type: object
  required: [attachmentId, attachmentType, make, model, subTypeSize, status, standaloneDailyRateMinor, isLinkedToFleet]
  properties:
    attachmentId:
      type: string
      format: uuid
    attachmentType:
      type: string
    make:
      type: string
    model:
      type: string
    subTypeSize:
      type: string
    status:
      type: string
    standaloneDailyRateMinor:
      type: integer
      format: int64
    isLinkedToFleet:
      type: boolean
    linkedFleetId:
      type: string
      format: uuid
      nullable: true
    primaryPhotoUri:
      type: string
      nullable: true

AttachmentInventoryListResponseData:
  type: object
  required: [totalCount, attachments]
  properties:
    totalCount:
      type: integer
    attachments:
      type: array
      items:
        $ref: '#/AttachmentInventoryItem'

AttachmentInventorySuccessResponse:
  type: object
  required: [success, data, error, meta]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/AttachmentInventoryListResponseData'
    error:
      type: object
      nullable: true
      default: null
    meta:
      $ref: './common.yaml#/ResponseMeta'

LinkFleetAttachmentRequest:
  type: object
  required: [attachmentId, bundledDailyRateMinor]
  properties:
    attachmentId:
      type: string
      format: uuid
    bundledDailyRateMinor:
      type: integer
      format: int64

LinkFleetAttachmentResponseData:
  type: object
  required: [fleetId, attachmentId, bundledDailyRateMinor, discountPercentage, status]
  properties:
    fleetId:
      type: string
      format: uuid
    attachmentId:
      type: string
      format: uuid
    bundledDailyRateMinor:
      type: integer
      format: int64
    discountPercentage:
      type: number
    status:
      type: string

LinkFleetAttachmentSuccessResponse:
  type: object
  required: [success, data, error, meta]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/LinkFleetAttachmentResponseData'
    error:
      type: object
      nullable: true
      default: null
    meta:
      $ref: './common.yaml#/ResponseMeta'

CheckBundledAvailabilityRequest:
  type: object
  required: [fleetId, attachmentIds, startDate, endDate]
  properties:
    fleetId:
      type: string
      format: uuid
    attachmentIds:
      type: array
      items:
        type: string
        format: uuid
    startDate:
      type: string
      format: date
    endDate:
      type: string
      format: date

AttachmentAvailabilityStatus:
  type: object
  required: [attachmentId, isAvailable, dailyRateAppliedMinor]
  properties:
    attachmentId:
      type: string
      format: uuid
    isAvailable:
      type: boolean
    dailyRateAppliedMinor:
      type: integer
      format: int64

CheckBundledAvailabilityResponseData:
  type: object
  required: [fleetAvailable, allAttachmentsAvailable, attachmentStatuses, totalCombinedDailyRateMinor]
  properties:
    fleetAvailable:
      type: boolean
    allAttachmentsAvailable:
      type: boolean
    attachmentStatuses:
      type: array
      items:
        $ref: '#/AttachmentAvailabilityStatus'
    totalCombinedDailyRateMinor:
      type: integer
      format: int64

CheckBundledAvailabilitySuccessResponse:
  type: object
  required: [success, data, error, meta]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/CheckBundledAvailabilityResponseData'
    error:
      type: object
      nullable: true
      default: null
    meta:
      $ref: './common.yaml#/ResponseMeta'
