# Logistics Transport Integration, Sub-Bookings & Reverse Cascades Schemas (Partition 05-08)

GeoCoordinates:
  type: object
  required:
    - latitude
    - longitude
  properties:
    latitude:
      type: number
      format: double
      minimum: -90
      maximum: 90
      example: 8.9124
    longitude:
      type: number
      format: double
      minimum: -180
      maximum: 180
      example: 38.7412
    locationName:
      type: string
      maxLength: 200
      example: Kality Industrial Depot

MachineLogisticsSpecs:
  type: object
  required:
    - operatingWeightKg
    - transportLengthMm
    - transportWidthMm
    - transportHeightMm
  properties:
    operatingWeightKg:
      type: number
      format: double
      example: 21800.0
    transportLengthMm:
      type: integer
      format: int32
      example: 9530
    transportWidthMm:
      type: integer
      format: int32
      example: 2980
    transportHeightMm:
      type: integer
      format: int32
      example: 3150

LogisticsMatchRequest:
  type: object
  required:
    - searchRadiusKm
    - pickupDate
  properties:
    searchRadiusKm:
      type: integer
      format: int32
      minimum: 1
      maximum: 500
      example: 75
    pickupDate:
      type: string
      format: date-time
      example: "2026-11-05T06:00:00+03:00"

MatchedLogisticsFleet:
  type: object
  required:
    - fleetId
    - make
    - model
    - ownerTradingName
    - payloadCapacityKg
    - deckWellLengthMm
    - deckWidthMm
    - tareWeightKg
    - axleCount
    - dailyRateMinor
    - currency
    - distanceFromDepotMeters
    - averageRating
  properties:
    fleetId:
      type: string
      format: uuid
    make:
      type: string
      example: Sinotruk
    model:
      type: string
      example: Howo 6x4 with Tri-Axle Lowbed
    ownerTradingName:
      type: string
      example: Girma Heavy Haulage PLC
    payloadCapacityKg:
      type: number
      format: double
      example: 40000.0
    deckWellLengthMm:
      type: integer
      format: int32
      example: 11000
    deckWidthMm:
      type: integer
      format: int32
      example: 3100
    tareWeightKg:
      type: number
      format: double
      example: 14500.0
    axleCount:
      type: integer
      format: int32
      example: 3
    dailyRateMinor:
      type: integer
      format: int64
      example: 1800000
    currency:
      type: string
      example: ETB
    distanceFromDepotMeters:
      type: number
      format: double
      example: 8420.0
    averageRating:
      type: number
      format: double
      example: 4.95

LogisticsMatchResponseData:
  type: object
  required:
    - parentBookingId
    - selfMoveCapable
    - recommendedTrailerClass
    - abnormalLoadEscortRequired
    - machineSpecs
    - requiredMinimumPayloadKg
    - matchingCarriersCount
    - availableLogisticsFleets
  properties:
    parentBookingId:
      type: string
      format: uuid
    selfMoveCapable:
      type: boolean
      example: false
    recommendedTrailerClass:
      type: string
      example: Two-Axle Lowboy Trailer (25t Payload Capacity)
    abnormalLoadEscortRequired:
      type: boolean
      example: false
    machineSpecs:
      $ref: '#/MachineLogisticsSpecs'
    requiredMinimumPayloadKg:
      type: number
      format: double
      example: 23980.0
    matchingCarriersCount:
      type: integer
      format: int32
      example: 1
    availableLogisticsFleets:
      type: array
      items:
        $ref: '#/MatchedLogisticsFleet'

CreateLogisticsSubBookingRequest:
  type: object
  required:
    - logisticsFleetId
    - pickupDateTime
    - originCoordinates
    - destinationCoordinates
  properties:
    logisticsFleetId:
      type: string
      format: uuid
    pickupDateTime:
      type: string
      format: date-time
      example: "2026-11-05T06:30:00+03:00"
    originCoordinates:
      $ref: '#/GeoCoordinates'
    destinationCoordinates:
      $ref: '#/GeoCoordinates'

CarrierContactInfo:
  type: object
  required:
    - fullName
    - phoneNumber
  properties:
    fullName:
      type: string
      example: Ato Girma Wolde
    phoneNumber:
      type: string
      example: "+251911449120"

LogisticsSubBookingResponseData:
  type: object
  required:
    - subBookingId
    - parentBookingId
    - status
    - freightHireFeeMinor
    - platformCommissionBps
    - platformCommissionRate
    - commissionOwedMinor
    - currency
    - abnormalLoadEscortRequired
    - carrierContact
  properties:
    subBookingId:
      type: string
      format: uuid
    parentBookingId:
      type: string
      format: uuid
    status:
      type: string
      example: CONFIRMED
    freightHireFeeMinor:
      type: integer
      format: int64
      example: 3600000
    platformCommissionBps:
      type: integer
      format: int32
      example: 250
    platformCommissionRate:
      type: string
      example: "0.025"
    commissionOwedMinor:
      type: integer
      format: int64
      example: 90000
    currency:
      type: string
      example: ETB
    abnormalLoadEscortRequired:
      type: boolean
      example: false
    escortFeeMinor:
      type: integer
      format: int64
      example: 0
    carrierContact:
      $ref: '#/CarrierContactInfo'

ExternalTransportRequest:
  type: object
  required:
    - carrierName
    - driverFullName
    - driverPhoneNumber
    - primeMoverPlateNumber
    - estimatedArrivalDateTime
  properties:
    carrierName:
      type: string
      minLength: 2
      maxLength: 120
      example: Private In-House Fleet
    driverFullName:
      type: string
      minLength: 2
      maxLength: 120
      example: Tadesse Bekele
    driverPhoneNumber:
      type: string
      pattern: '^\+[1-9]\d{7,14}$'
      example: "+251911884912"
    primeMoverPlateNumber:
      type: string
      minLength: 3
      maxLength: 32
      example: ET-3-44192
    estimatedArrivalDateTime:
      type: string
      format: date-time
      example: "2026-11-05T08:00:00+03:00"

ExternalTransportResponseData:
  type: object
  required:
    - parentBookingId
    - status
    - externalTransportRegistered
    - carrierName
    - driverFullName
    - driverPhoneNumber
    - primeMoverPlateNumber
    - estimatedArrivalDateTime
  properties:
    parentBookingId:
      type: string
      format: uuid
    status:
      type: string
      example: READY_FOR_PICKUP
    externalTransportRegistered:
      type: boolean
      example: true
    carrierName:
      type: string
    driverFullName:
      type: string
    driverPhoneNumber:
      type: string
    primeMoverPlateNumber:
      type: string
    estimatedArrivalDateTime:
      type: string
      format: date-time

WinchingInspectionPhoto:
  type: object
  required:
    - angle
    - storageUri
  properties:
    angle:
      type: string
      enum:
        - RIG_PROFILE
        - CHAIN_BINDERS
        - BOOM_PINNED
        - RAMPS_LOCKED
    storageUri:
      type: string
      format: uri

LogisticsDispatchRequest:
  type: object
  required:
    - targetStage
  properties:
    targetStage:
      type: string
      enum:
        - DISPATCHED
        - LOADING_INSPECTION
        - IN_TRANSIT
        - READY_FOR_PICKUP
    winchingPhotos:
      type: array
      items:
        $ref: '#/WinchingInspectionPhoto'
    notes:
      type: string
      maxLength: 500

LogisticsDispatchResponseData:
  type: object
  required:
    - subBookingId
    - parentBookingId
    - subBookingStatus
    - parentBookingStatus
    - updatedAt
  properties:
    subBookingId:
      type: string
      format: uuid
    parentBookingId:
      type: string
      format: uuid
    subBookingStatus:
      type: string
      example: IN_TRANSIT
    parentBookingStatus:
      type: string
      example: CONFIRMED
    winchingPhotosCount:
      type: integer
      format: int32
    updatedAt:
      type: string
      format: date-time

TransshipmentAlertRequest:
  type: object
  required:
    - currentLocation
    - failureCategory
    - failureDescription
    - photos
  properties:
    currentLocation:
      $ref: '#/GeoCoordinates'
    failureCategory:
      type: string
      enum:
        - PRIME_MOVER_ENGINE_BLOWN
        - TRAILER_AXLE_FAILURE
        - HYDRAULIC_RAMP_FAILURE
        - CORRIDOR_BLOCKADE
        - OTHER
    failureDescription:
      type: string
      minLength: 10
      maxLength: 1000
    photos:
      type: array
      minItems: 1
      items:
        type: string
        format: uri

TransshipmentAlertResponseData:
  type: object
  required:
    - transshipmentId
    - subBookingId
    - parentBookingId
    - subBookingStatus
    - parentBookingStatus
    - hotSwapSlaDeadline
    - transshipmentBountyMinor
    - currency
    - candidateCarriersCount
  properties:
    transshipmentId:
      type: string
      format: uuid
    subBookingId:
      type: string
      format: uuid
    parentBookingId:
      type: string
      format: uuid
    subBookingStatus:
      type: string
      example: TRANSSHIPMENT_REQUIRED
    parentBookingStatus:
      type: string
      example: AWAITING_FLEET_READINESS
    hotSwapSlaDeadline:
      type: string
      format: date-time
    transshipmentBountyMinor:
      type: integer
      format: int64
      example: 720000
    currency:
      type: string
      example: ETB
    candidateCarriersCount:
      type: integer
      format: int32
      example: 2

AcceptTransshipmentRequest:
  type: object
  required:
    - replacementFleetId
  properties:
    replacementFleetId:
      type: string
      format: uuid

AcceptTransshipmentResponseData:
  type: object
  required:
    - transshipmentId
    - subBookingId
    - parentBookingId
    - status
    - subBookingStatus
    - replacementFleetId
    - acceptedAt
  properties:
    transshipmentId:
      type: string
      format: uuid
    subBookingId:
      type: string
      format: uuid
    parentBookingId:
      type: string
      format: uuid
    status:
      type: string
      example: ACCEPTED
    subBookingStatus:
      type: string
      example: IN_TRANSIT
    replacementFleetId:
      type: string
      format: uuid
    acceptedAt:
      type: string
      format: date-time

ReverseCascadeRequest:
  type: object
  properties:
    reason:
      type: string
      maxLength: 500
      example: Emergency 60-minute roadside transshipment SLA expired without replacement carrier.

ReverseCascadeResponseData:
  type: object
  required:
    - parentBookingId
    - subBookingId
    - resolution
    - renterRefundDueMinor
    - ownerPenaltyLeviedMinor
    - ownerCommissionRestitutionMinor
    - carrierDefaultPenaltyMinor
    - currency
    - parentStatus
    - subStatus
  properties:
    parentBookingId:
      type: string
      format: uuid
    subBookingId:
      type: string
      format: uuid
    resolution:
      type: string
      example: FORCE_MAJEURE_CANCELLATION
    renterRefundDueMinor:
      type: integer
      format: int64
      example: 10675000
    ownerPenaltyLeviedMinor:
      type: integer
      format: int64
      example: 0
    ownerCommissionRestitutionMinor:
      type: integer
      format: int64
      example: 1067500
    carrierDefaultPenaltyMinor:
      type: integer
      format: int64
      example: 720000
    currency:
      type: string
      example: ETB
    parentStatus:
      type: string
      example: CANCELLED
    subStatus:
      type: string
      example: CANCELLED_CARRIER_DEFAULT

LogisticsOverviewResponseData:
  type: object
  required:
    - parentBookingId
    - parentBookingStatus
    - selfMoveCapable
    - logisticsMode
  properties:
    parentBookingId:
      type: string
      format: uuid
    parentBookingStatus:
      type: string
    selfMoveCapable:
      type: boolean
    logisticsMode:
      type: string
      enum:
        - SELF_MOVE
        - UNASSIGNED
        - PLATFORM_SUB_BOOKING
        - EXTERNAL_TRANSPORT
    subBooking:
      $ref: '#/LogisticsSubBookingResponseData'
    externalTransport:
      $ref: '#/ExternalTransportResponseData'
    activeTransshipment:
      $ref: '#/TransshipmentAlertResponseData'
    reverseCascade:
      $ref: '#/ReverseCascadeResponseData'

LogisticsMatchSuccessResponse:
  type: object
  required: [success, data, error, meta]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/LogisticsMatchResponseData'
    error:
      type: object
      nullable: true
      enum: [null]
    meta:
      $ref: './common.yaml#/ResponseMeta'

LogisticsSubBookingSuccessResponse:
  type: object
  required: [success, data, error, meta]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/LogisticsSubBookingResponseData'
    error:
      type: object
      nullable: true
      enum: [null]
    meta:
      $ref: './common.yaml#/ResponseMeta'

ExternalTransportSuccessResponse:
  type: object
  required: [success, data, error, meta]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/ExternalTransportResponseData'
    error:
      type: object
      nullable: true
      enum: [null]
    meta:
      $ref: './common.yaml#/ResponseMeta'

LogisticsDispatchSuccessResponse:
  type: object
  required: [success, data, error, meta]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/LogisticsDispatchResponseData'
    error:
      type: object
      nullable: true
      enum: [null]
    meta:
      $ref: './common.yaml#/ResponseMeta'

TransshipmentAlertSuccessResponse:
  type: object
  required: [success, data, error, meta]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/TransshipmentAlertResponseData'
    error:
      type: object
      nullable: true
      enum: [null]
    meta:
      $ref: './common.yaml#/ResponseMeta'

AcceptTransshipmentSuccessResponse:
  type: object
  required: [success, data, error, meta]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/AcceptTransshipmentResponseData'
    error:
      type: object
      nullable: true
      enum: [null]
    meta:
      $ref: './common.yaml#/ResponseMeta'

ReverseCascadeSuccessResponse:
  type: object
  required: [success, data, error, meta]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/ReverseCascadeResponseData'
    error:
      type: object
      nullable: true
      enum: [null]
    meta:
      $ref: './common.yaml#/ResponseMeta'

LogisticsOverviewSuccessResponse:
  type: object
  required: [success, data, error, meta]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/LogisticsOverviewResponseData'
    error:
      type: object
      nullable: true
      enum: [null]
    meta:
      $ref: './common.yaml#/ResponseMeta'
