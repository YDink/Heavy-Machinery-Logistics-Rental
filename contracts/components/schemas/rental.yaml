    error:
      type: object
      nullable: true
      default: null
    meta:
      $ref: './common.yaml#/ResponseMeta'

ActiveRentalHUDSuccessResponse:
  type: object
  required: [success, data, error, meta]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/ActiveRentalHUDResponseData'
    error:
      type: object
      nullable: true
      default: null
    meta:
      $ref: './common.yaml#/ResponseMeta'

RentalExtensionSuccessResponse:
  type: object
  required: [success, data, error, meta]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/RentalExtensionResponseData'
    error:
      type: object
      nullable: true
      default: null
    meta:
      $ref: './common.yaml#/ResponseMeta'

MechanicalBreakdownSuccessResponse:
  type: object
  required: [success, data, error, meta]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
      $ref: '#/MechanicalBreakdownResponseData'
    error:
      type: object
      nullable: true
      default: null
    meta:
      $ref: './common.yaml#/ResponseMeta'

BreakdownResolutionSuccessResponse:
  type: object
  required: [success, data, error, meta]
  properties:
    success:
      type: boolean
      enum: [true]
    data:
