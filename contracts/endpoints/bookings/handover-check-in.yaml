post:
  tags: [booking]
  summary: Execute machine handover check-in via challenge PIN
  description: Validates dynamic 6-digit challenge PIN and baseline check-in hour meter, transitioning state to ACTIVE.
  operationId: handoverCheckIn
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: '../../components/parameters/idempotency-key-header.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/booking.yaml#/HandoverCheckInRequest'
  responses:
    '200':
      description: Handover confirmed and rental active.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/booking.yaml#/BookingDetailSuccessResponse'
    '400':
      $ref: '../../components/responses/bad-request.yaml'
    '401':
      $ref: '../../components/responses/unauthorized.yaml'
    '404':
      $ref: '../../components/responses/not-found.yaml'
    '409':
      $ref: '../../components/responses/conflict.yaml'
    '500':
      $ref: '../../components/responses/internal-server-error.yaml'
