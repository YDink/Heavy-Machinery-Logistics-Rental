post:
  tags: [booking]
  summary: Submit bank transfer payment slip
  description: Ingests non-custodial bank wire evidence, performs ClamAV scanning, and advances booking state.
  operationId: submitBookingPaymentEvidence
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: '../../components/parameters/idempotency-key-header.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/booking.yaml#/SubmitPaymentSlipRequest'
  responses:
    '201':
      description: Payment slip uploaded and queued for owner audit.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/booking.yaml#/PaymentSlipSuccessResponse'
    '400':
      $ref: '../../components/responses/bad-request.yaml'
    '401':
      $ref: '../../components/responses/unauthorized.yaml'
    '404':
      $ref: '../../components/responses/not-found.yaml'
    '409':
      $ref: '../../components/responses/conflict.yaml'
    '422':
      $ref: '../../components/responses/unprocessable-entity.yaml'
    '500':
      $ref: '../../components/responses/internal-server-error.yaml'
