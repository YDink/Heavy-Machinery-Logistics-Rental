post:
  tags: [booking]
  summary: Report mid-transit breakdown and open emergency transshipment SLA
  description: Transitions sub-booking to TRANSSHIPMENT_REQUIRED, freezes parent booking to AWAITING_FLEET_READINESS, opens a 60-minute hot-swap window with a +20% bounty, and queries replacement carriers within 50km.
  operationId: reportLogisticsTransshipmentAlert
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: '../../components/parameters/idempotency-key-header.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/logistics.yaml#/TransshipmentAlertRequest'
  responses:
    '200':
      description: Emergency roadside transshipment window opened.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/logistics.yaml#/TransshipmentAlertSuccessResponse'
    '400':
      $ref: '../../components/responses/bad-request.yaml'
    '401':
      $ref: '../../components/responses/unauthorized.yaml'
    '403':
      $ref: '../../components/responses/forbidden.yaml'
    '404':
      $ref: '../../components/responses/not-found.yaml'
    '409':
      $ref: '../../components/responses/conflict.yaml'
    '500':
      $ref: '../../components/responses/internal-server-error.yaml'
