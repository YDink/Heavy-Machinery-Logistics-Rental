get:
  tags: [machinery]
  summary: Retrieve detailed fleet asset by ID
  description: Fetches full specification, current operational status, and pricing rules for an equipment item.
  operationId: getFleetById
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Fleet asset details returned.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/fleet.yaml#/FleetDetailSuccessResponse'
    '404':
      $ref: '../../components/responses/not-found.yaml'
    '500':
      $ref: '../../components/responses/internal-server-error.yaml'
