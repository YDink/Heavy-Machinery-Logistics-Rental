post:
  tags: [booking]
  summary: Contractor response to lodged structural damage claim
  description: Accepts damage liability into final settlement statement or disputes docket for platform compliance arbitration.
  operationId: respondToDamageClaim
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: '../../components/parameters/idempotency-key-header.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/completion.yaml#/DamageClaimResponseRequest'
  responses:
    '200':
      description: Damage claim response recorded successfully.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/completion.yaml#/DamageClaimResponseSuccessResponse'
    '400':
      $ref: '../../components/responses/bad-request.yaml'
    '401':
      $ref: '../../components/responses/unauthorized.yaml'
    '404':
      $ref: '../../components/responses/not-found.yaml'
    '409':
      $ref: '../../components/responses/conflict.yaml'
    '422':
      $ref: '../../components/responses/unprocessable-entity.yaml'
    '500':
      $ref: '../../components/responses/internal-server-error.yaml'
