post:
  tags: [booking]
  summary: Submit a rental extension request for forward dates
  description: Validates forward availability against GiST exclusion constraints, computes 50% advance quote, and locks dates.
  operationId: requestRentalExtension
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: '../../components/parameters/idempotency-key-header.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/rental.yaml#/RentalExtensionRequest'
  responses:
    '200':
      description: Extension request registered and forward dates held.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/rental.yaml#/RentalExtensionSuccessResponse'
    '400':
      $ref: '../../components/responses/bad-request.yaml'
    '401':
      $ref: '../../components/responses/unauthorized.yaml'
    '404':
      $ref: '../../components/responses/not-found.yaml'
    '409':
      $ref: '../../components/responses/conflict.yaml'
    '422':
      $ref: '../../components/responses/unprocessable-entity.yaml'
    '500':
      $ref: '../../components/responses/internal-server-error.yaml'
