post:
  tags: [booking]
  summary: Submit pre-rental photographic reticle inspection and hour meter reading
  description: Validates multi-angle condition photos and asserts check-in meter is non-regressive against machine baseline.
  operationId: handoverInspect
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: '../../components/parameters/idempotency-key-header.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/rental.yaml#/HandoverInspectionRequest'
  responses:
    '200':
      description: Inspection photos and meter reading successfully attested.
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/rental.yaml#/HandoverInspectionSuccessResponse'
    '400':
      $ref: '../../components/responses/bad-request.yaml'
    '401':
      $ref: '../../components/responses/unauthorized.yaml'
    '404':
      $ref: '../../components/responses/not-found.yaml'
    '422':
      $ref: '../../components/responses/unprocessable-entity.yaml'
    '500':
      $ref: '../../components/responses/internal-server-error.yaml'
