openapi: 3.1.0
info:
  title: Dink Machinery Marketplace API
  description: |
    Canonical REST API contract for Dink Machinery — a heavy machinery and logistics rental marketplace.
    Enforces standardized JSON envelopes, RFC 9457 Problem Details error models, cursor-based pagination,
    integer minor-unit financial structures, and multi-country parameterization.
  version: 1.0.0
  contact:
    name: Dink Machinery Engineering Team
    email: api-core@dinkmachinery.com
servers:
  - url: https://api.dinkmachinery.com/api/v1
    description: Production Environment
  - url: https://staging-api.dinkmachinery.com/api/v1
    description: Staging Environment
  - url: http://localhost:8080/api/v1
    description: Local Development Environment
tags:
  - name: auth
    description: Identity, multi-factor authentication, session lifecycle, and credentials.
  - name: machinery
    description: Fleet directory, specifications, attachments, and temporal availability.
  - name: booking
    description: 20-state reservation lifecycle, active holds, transitions, and inspections.
  - name: payment
    description: Double-entry ledger access, gateway orchestrations, and owner wallets.
  - name: geo
    description: Spatial search and PostGIS-backed machinery discovery.
  - name: admin
    description: Dynamic UI configurations, multi-country registries, and audit logs.
paths:
  /auth/otp/request:
    post:
      tags:
        - auth
      summary: Request an OTP verification code
      description: Issues a time-bound verification code to a validated mobile telephone number.
      operationId: requestOtp
      parameters:
        - $ref: '#/components/parameters/country-code-header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phoneNumber
                - purpose
              properties:
                phoneNumber:
                  type: string
                  pattern: ^\+[1-9]\d{1,14}$
                  example: '+251911223344'
                purpose:
                  type: string
                  enum:
                    - REGISTRATION
                    - LOGIN
                    - PASSWORD_RESET
                    - STEP_UP
                  example: LOGIN
      responses:
        '200':
          description: OTP dispatched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestSuccessResponse'
        '400':
          $ref: '#/components/responses/bad-request'
        '429':
          $ref: '#/components/responses/too-many-requests'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /auth/otp/verify:
    post:
      tags:
        - auth
      summary: Verify OTP and acquire user session tokens
      description: Validates supplied code against pending challenge and returns authenticated session tokens.
      operationId: verifyOtp
      parameters:
        - $ref: '#/components/parameters/country-code-header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - verificationSessionId
                - code
              properties:
                verificationSessionId:
                  type: string
                  format: uuid
                code:
                  type: string
                  pattern: ^[0-9]{6}$
                  example: '123456'
      responses:
        '200':
          description: Verification successful, tokens generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenSuccessResponse'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /auth/session/refresh:
    post:
      tags:
        - auth
      summary: Refresh active JWT access token
      description: Exchanges a cryptographically valid refresh token for a renewed access token.
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenSuccessResponse'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /auth/users/me:
    get:
      tags:
        - auth
      summary: Retrieve current authenticated user profile
      description: Returns the user aggregate belonging to the active Bearer token.
      operationId: getCurrentUserProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileSuccessResponse'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /categories:
    get:
      tags:
        - machinery
      summary: List machinery taxonomy categories
      description: Fetches hierarchical category nodes for machinery classification.
      operationId: listCategories
      responses:
        '200':
          description: Category taxonomy returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListSuccessResponse'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /fleets:
    get:
      tags:
        - machinery
      summary: List available fleet equipment
      description: Returns a cursor-paginated list of registered machinery filtered by parameters.
      operationId: listFleets
      parameters:
        - $ref: '#/components/parameters/cursor-query-param'
        - $ref: '#/components/parameters/limit-query-param'
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - AVAILABLE
              - RENTED
              - UNDER_MAINTENANCE
      responses:
        '200':
          description: Paginated fleet catalog returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetListSuccessResponse'
        '500':
          $ref: '#/components/responses/internal-server-error'
    post:
      tags:
        - machinery
      summary: Register a new machinery asset to fleet
      description: Adds a new equipment asset under the authenticated owner.
      operationId: createFleetAsset
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/idempotency-key-header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFleetRequest'
      responses:
        '201':
          description: Asset successfully registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetDetailSuccessResponse'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /fleets/{id}:
    get:
      tags:
        - machinery
      summary: Retrieve detailed fleet asset by ID
      description: Fetches full specification, current operational status, and pricing rules for an equipment item.
      operationId: getFleetById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fleet asset details returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetDetailSuccessResponse'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /geo/fleets/radius-search:
    get:
      tags:
        - geo
      summary: Spatial radius search for machinery
      description: Executes a PostGIS spatial distance query to locate machinery within a specified kilometer radius.
      operationId: searchFleetsByRadius
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
            example: 9.03
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
            example: 38.74
        - name: radiusKm
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 500
            example: 50
        - $ref: '#/components/parameters/limit-query-param'
        - $ref: '#/components/parameters/cursor-query-param'
      responses:
        '200':
          description: Machinery located within target radius returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetListSuccessResponse'
        '400':
          $ref: '#/components/responses/bad-request'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /bookings:
    get:
      tags:
        - booking
      summary: List current user bookings
      description: Returns paginated reservation records for the authenticated renter or equipment owner.
      operationId: listBookings
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/cursor-query-param'
        - $ref: '#/components/parameters/limit-query-param'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/BookingStatus'
      responses:
        '200':
          description: User bookings returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListSuccessResponse'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/internal-server-error'
    post:
      tags:
        - booking
      summary: Create a booking reservation hold
      description: Places a temporal Valkey lock and creates an initial booking in PENDING_HOLD state.
      operationId: createBooking
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/idempotency-key-header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking created and hold lock established.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetailSuccessResponse'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /bookings/{id}:
    get:
      tags:
        - booking
      summary: Retrieve detailed booking state by ID
      description: Returns complete 20-state lifecycle status, inspection timeline, and financial breakdown.
      operationId: getBookingById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking entity returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetailSuccessResponse'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /bookings/{id}:confirm-payment:
    post:
      tags:
        - booking
      summary: Confirm payment and transition booking to CONFIRMED
      description: Validates escrow hold, posts ledger legs, and transitions state machine to CONFIRMED.
      operationId: confirmBookingPayment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/idempotency-key-header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expectedVersion
                - paymentReference
              properties:
                expectedVersion:
                  type: integer
                  description: Optimistic concurrency control check.
                  example: 1
                paymentReference:
                  type: string
                  example: TXN-ETB-902348
      responses:
        '200':
          description: Booking transitioned to CONFIRMED and escrow recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetailSuccessResponse'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /bookings/{id}:cancel:
    post:
      tags:
        - booking
      summary: Cancel a pending or active booking
      description: Traces cancellation rules, evaluates cancellation grace periods, and calculates refunds.
      operationId: cancelBooking
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/idempotency-key-header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expectedVersion
                - reason
              properties:
                expectedVersion:
                  type: integer
                  example: 2
                reason:
                  type: string
                  example: Site excavation delayed due to heavy rainfall.
      responses:
        '200':
          description: Booking successfully cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetailSuccessResponse'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '409':
          $ref: '#/components/responses/conflict'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /bookings/{id}/inspections:
    post:
      tags:
        - booking
      summary: Submit check-in or check-out inspection
      description: Records hours meter, fuel reading, condition notes, and media URLs for an inspection phase.
      operationId: submitBookingInspection
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/idempotency-key-header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitInspectionRequest'
      responses:
        '201':
          description: Inspection recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionDetailSuccessResponse'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /payments/initiate:
    post:
      tags:
        - payment
      summary: Initiate payment gateway transaction
      description: Triggers payment orchestration via Telebirr, CBE Birr, or Chapa.
      operationId: initiatePayment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/idempotency-key-header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bookingId
                - paymentMethod
              properties:
                bookingId:
                  type: string
                  format: uuid
                paymentMethod:
                  type: string
                  enum:
                    - TELEBIRR
                    - CBE_BIRR
                    - CHAPA
                    - DIRECT_TRANSFER
                  example: TELEBIRR
      responses:
        '200':
          description: Gateway transaction initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInitiateSuccessResponse'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /wallets/me:
    get:
      tags:
        - payment
      summary: Retrieve owner wallet balance and escrow stats
      description: Returns live available balance and locked escrow amounts for the authenticated asset owner.
      operationId: getMyWallet
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Wallet details returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletSuccessResponse'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /wallets/me/transactions:
    get:
      tags:
        - payment
      summary: List owner wallet transaction ledger entries
      description: Returns paginated double-entry financial transaction history for the owner wallet.
      operationId: listWalletTransactions
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/cursor-query-param'
        - $ref: '#/components/parameters/limit-query-param'
      responses:
        '200':
          description: Wallet transaction entries returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionListSuccessResponse'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /admin/ui-config:
    get:
      tags:
        - admin
      summary: Retrieve dynamic metadata-driven UI configuration
      description: Returns navigation schema, table column definitions, and active feature flags for administrative shell.
      operationId: getAdminUiConfig
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dynamic UI configuration metadata returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUiConfigSuccessResponse'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /admin/countries:
    get:
      tags:
        - admin
      summary: List supported operational country configurations
      description: Returns registry of operating countries, dialing codes, currencies, and tax rates.
      operationId: listCountryConfigs
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Country configs returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryConfigListSuccessResponse'
        '401':
          $ref: '#/components/responses/unauthorized'
        '500':
          $ref: '#/components/responses/internal-server-error'
  /admin/countries/{countryCode}:
    get:
      tags:
        - admin
      summary: Retrieve specific country configuration by ISO code
      description: Returns tax basis points, currency rules, and feature flags for an operating country.
      operationId: getCountryConfigByCode
      security:
        - BearerAuth: []
      parameters:
        - name: countryCode
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Z]{2}$
            example: ET
      responses:
        '200':
          description: Country configuration returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryConfigDetailSuccessResponse'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
    put:
      tags:
        - admin
      summary: Update operating parameters for country configuration
      description: Adjusts standard tax basis points, payment hold timeout, or country activation status.
      operationId: updateCountryConfig
      security:
        - BearerAuth: []
      parameters:
        - name: countryCode
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Z]{2}$
        - $ref: '#/components/parameters/idempotency-key-header'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCountryConfigRequest'
      responses:
        '200':
          description: Country configuration successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryConfigDetailSuccessResponse'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not-found'
        '500':
          $ref: '#/components/responses/internal-server-error'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Encrypted session JWT access token.
  parameters:
    XCountryCodeHeader:
      $ref: '#/components/parameters/country-code-header'
    IdempotencyKeyHeader:
      $ref: '#/components/parameters/idempotency-key-header'
    CursorQueryParam:
      $ref: '#/components/parameters/cursor-query-param'
    LimitQueryParam:
      $ref: '#/components/parameters/limit-query-param'
    country-code-header:
      name: X-Country-Code
      in: header
      required: false
      schema:
        type: string
        pattern: ^[A-Z]{2}$
        default: ET
      description: ISO 3166-1 alpha-2 operational country code driving multi-country logic.
    cursor-query-param:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor identifier for deterministic keyset pagination.
    limit-query-param:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum number of records to return per page.
    idempotency-key-header:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Unique mutation request key preventing duplicate execution.
  responses:
    BadRequestError:
      $ref: '#/components/responses/bad-request'
    UnauthorizedError:
      $ref: '#/components/responses/unauthorized'
    ForbiddenError:
      $ref: '#/components/responses/forbidden'
    NotFoundError:
      $ref: '#/components/responses/not-found'
    ConflictError:
      $ref: '#/components/responses/conflict'
    TooManyRequestsError:
      $ref: '#/components/responses/too-many-requests'
    InternalServerError:
      $ref: '#/components/responses/internal-server-error'
    bad-request:
      description: Bad Request — Request failed initial edge schema or syntactic validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    too-many-requests:
      description: Too Many Requests — Ingress rate-limit quota exceeded for caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    internal-server-error:
      description: Internal Server Error — Unhandled server failure (anonymized error token emitted).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    unauthorized:
      description: Unauthorized — Authentication credentials missing, invalid, or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    conflict:
      description: Conflict — Invariant violation, state machine failure, or optimistic concurrency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    not-found:
      description: Not Found — Specified resource entity does not exist or has been soft-deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    forbidden:
      description: Forbidden — Authenticated principal lacks RBAC permission to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    MoneyAmount:
      type: object
      required:
        - amountMinor
        - currency
      description: Integer minor currency units preventing precision truncation.
      properties:
        amountMinor:
          type: integer
          format: int64
          description: Amount in minor units (e.g., 500000 = 5,000.00 ETB).
          example: 500000
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 three-letter currency symbol.
          example: ETB
    ResponseMeta:
      type: object
      required:
        - version
        - requestId
        - timestamp
      properties:
        version:
          type: string
          example: '1.0'
        requestId:
          type: string
          example: req_01HP8XYZ12345678
        timestamp:
          type: string
          format: date-time
          example: '2026-10-26T07:12:00Z'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        warnings:
          type: array
          items:
            type: string
    PaginationMeta:
      type: object
      required:
        - hasMore
      nullable: true
      properties:
        nextCursor:
          type: string
          nullable: true
          example: ZXhhbXBsZS1jdXJzb3ItdmFsdWU=
        prevCursor:
          type: string
          nullable: true
          example: null
        hasMore:
          type: boolean
          example: true
    RFC9457ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - code
      properties:
        type:
          type: string
          format: uri
          example: https://api.dinkmachinery.com/errors/invalid-booking-state
        title:
          type: string
          example: Invalid Booking State Transition
