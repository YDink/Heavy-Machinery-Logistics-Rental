          example: "ETB"
        updatedAt:
          type: string
          format: date-time

    WalletTransaction:
      type: object
      required: [id, walletId, entryType, amount, runningBalance, referenceId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        walletId:
          type: string
          format: uuid
        entryType:
          type: string
          enum: [RENTAL_PAYOUT, ESCROW_RELEASE, PLATFORM_FEE, DISPUTE_DEBIT]
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        runningBalance:
          $ref: '#/components/schemas/MoneyAmount'
        referenceId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    PaymentInitiateResult:
      type: object
      required: [transactionId, checkoutUrl, expiresAt]
      properties:
        transactionId:
          type: string
          format: uuid
        checkoutUrl:
          type: string
          format: uri
          example: "https://telebirr.et/pay?token=ab897cd0"
        expiresAt:
          type: string
          format: date-time

    # --------------------------------------------------------------------------
    # Admin & Country Configuration Entities
    # --------------------------------------------------------------------------
    CountryConfig:
      type: object
      required: [countryCode, countryName, dialingPrefix, defaultCurrency, standardTaxRateBps, isEnabled]
      properties:
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
          example: "ET"
        countryName:
          type: string
          example: "Ethiopia"
        dialingPrefix:
          type: string
          example: "+251"
        defaultCurrency:
          type: string
          example: "ETB"
        currencyMinorUnitExponent:
          type: integer
          example: 2
        defaultTimezone:
          type: string
          example: "Africa/Addis_Ababa"
        taxLabel:
          type: string
          example: "VAT"
        standardTaxRateBps:
          type: integer
          description: Standard tax basis points (1500 bps = 15.00%).
          example: 1500
        minAgeDefault:
          type: integer
          example: 18
        paymentHoldTimeoutMins:
          type: integer
          example: 60
        isEnabled:
          type: boolean
          example: true

    UpdateCountryConfigRequest:
      type: object
      required: [standardTaxRateBps, paymentHoldTimeoutMins, isEnabled]
      properties:
        standardTaxRateBps:
          type: integer
          example: 1500
        paymentHoldTimeoutMins:
          type: integer
          example: 60
        isEnabled:
          type: boolean
          example: true

    AdminUiConfig:
      type: object
      required: [navigation, tables, featureToggles]
      properties:
        navigation:
          type: array
          items:
            type: object
            required: [key, label, route]
            properties:
              key:
                type: string
              label:
                type: string
              route:
                type: string
        tables:
          type: object
          additionalProperties:
            type: object
            required: [columns]
            properties:
              columns:
                type: array
                items:
                  type: object
                  required: [key, header, type]
                  properties:
                    key:
                      type: string
                    header:
                      type: string
                    type:
                      type: string
        featureToggles:
          type: object
          additionalProperties:
            type: boolean

