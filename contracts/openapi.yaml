          type: string
          format: uuid
          nullable: true
        iconUrl:
          type: string
          format: uri

    FleetAsset:
      type: object
      required: [id, ownerId, categoryId, model, registrationNumber, dailyRate, status, location, version]
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        make:
          type: string
          example: "Caterpillar"
        model:
          type: string
          example: "320D3"
        manufacturingYear:
          type: integer
          example: 2022
        registrationNumber:
          type: string
          example: "AA-3-98234"
        dailyRate:
          $ref: '#/components/schemas/MoneyAmount'
        status:
          type: string
          enum: [AVAILABLE, RENTED, UNDER_MAINTENANCE, DECOMMISSIONED]
          example: "AVAILABLE"
        location:
          type: object
          required: [latitude, longitude, addressText]
          properties:
            latitude:
              type: number
              format: double
              example: 9.0300
            longitude:
              type: number
              format: double
              example: 38.7400
            addressText:
              type: string
              example: "Bole Subcity, Addis Ababa"
        version:
          type: integer
          example: 1

    CreateFleetRequest:
      type: object
      required: [categoryId, make, model, manufacturingYear, registrationNumber, dailyRate, location]
      properties:
