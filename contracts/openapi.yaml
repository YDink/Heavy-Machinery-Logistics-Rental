openapi: 3.1.0
info:
  title: Dink Machinery Marketplace API
  description: |
    Canonical REST API contract for Dink Machinery — a heavy machinery and logistics rental marketplace.
    Enforces standardized JSON envelopes, RFC 9457 Problem Details error models, cursor-based pagination,
    integer minor-unit financial structures, and multi-country parameterization.
  version: 1.0.0
  contact:
    name: Dink Machinery Engineering Team
    email: api-core@dinkmachinery.com

servers:
  - url: https://api.dinkmachinery.com/api/v1
    description: Production Environment
  - url: https://staging-api.dinkmachinery.com/api/v1
    description: Staging Environment
  - url: http://localhost:8080/api/v1
    description: Local Development Environment

tags:
  - name: auth
    description: Identity, multi-factor authentication, session lifecycle, and credentials.
  - name: machinery
    description: Fleet directory, specifications, attachments, and temporal availability.
  - name: booking
    description: 20-state reservation lifecycle, active holds, transitions, and inspections.
  - name: payment
    description: Double-entry ledger access, gateway orchestrations, and owner wallets.
  - name: geo
    description: Spatial search and PostGIS-backed machinery discovery.
  - name: admin
    description: Dynamic UI configurations, multi-country registries, and audit logs.

paths:
  /auth/otp/request:
    $ref: './endpoints/auth/otp-request.yaml'
  /auth/otp/verify:
    $ref: './endpoints/auth/otp-verify.yaml'
  /auth/session/refresh:
    $ref: './endpoints/auth/session-refresh.yaml'
  /auth/users/me:
    $ref: './endpoints/auth/users-me.yaml'
  /categories:
    $ref: './endpoints/machinery/categories.yaml'
  /fleets:
    $ref: './endpoints/machinery/fleets.yaml'
  /fleets/{id}:
    $ref: './endpoints/machinery/fleet-by-id.yaml'
  /geo/fleets/radius-search:
    $ref: './endpoints/geo/radius-search.yaml'
  /bookings:
    $ref: './endpoints/bookings/bookings.yaml'
  /bookings/{id}:
    $ref: './endpoints/bookings/booking-by-id.yaml'
  /bookings/{id}:confirm-payment:
    $ref: './endpoints/bookings/confirm-payment.yaml'
  /bookings/{id}:cancel:
    $ref: './endpoints/bookings/cancel-booking.yaml'
  /bookings/{id}/inspections:
    $ref: './endpoints/bookings/inspections.yaml'
  /payments/initiate:
    $ref: './endpoints/payments/initiate-payment.yaml'
  /wallets/me:
    $ref: './endpoints/wallets/wallet-me.yaml'
  /wallets/me/transactions:
    $ref: './endpoints/wallets/transactions.yaml'
  /admin/ui-config:
    $ref: './endpoints/admin/ui-config.yaml'
  /admin/countries:
    $ref: './endpoints/admin/countries.yaml'
  /admin/countries/{countryCode}:
    $ref: './endpoints/admin/country-by-code.yaml'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Encrypted session JWT access token.

  parameters:
    XCountryCodeHeader:
      $ref: './components/parameters/country-code-header.yaml'
    IdempotencyKeyHeader:
      $ref: './components/parameters/idempotency-key-header.yaml'
    CursorQueryParam:
      $ref: './components/parameters/cursor-query-param.yaml'
    LimitQueryParam:
      $ref: './components/parameters/limit-query-param.yaml'

  responses:
    BadRequestError:
      $ref: './components/responses/bad-request.yaml'
    UnauthorizedError:
      $ref: './components/responses/unauthorized.yaml'
    ForbiddenError:
      $ref: './components/responses/forbidden.yaml'
    NotFoundError:
      $ref: './components/responses/not-found.yaml'
    ConflictError:
      $ref: './components/responses/conflict.yaml'
    TooManyRequestsError:
      $ref: './components/responses/too-many-requests.yaml'
    InternalServerError:
      $ref: './components/responses/internal-server-error.yaml'

  schemas:
    MoneyAmount:
      $ref: './components/schemas/common.yaml#/MoneyAmount'
    ResponseMeta:
      $ref: './components/schemas/common.yaml#/ResponseMeta'
    PaginationMeta:
      $ref: './components/schemas/common.yaml#/PaginationMeta'
    RFC9457ProblemDetails:
      $ref: './components/schemas/common.yaml#/RFC9457ProblemDetails'
    InvalidParam:
      $ref: './components/schemas/common.yaml#/InvalidParam'
    ErrorEnvelope:
      $ref: './components/schemas/common.yaml#/ErrorEnvelope'
    UserProfile:
      $ref: './components/schemas/auth.yaml#/UserProfile'
    AuthTokenPair:
      $ref: './components/schemas/auth.yaml#/AuthTokenPair'
    OtpRequestSuccessResponse:
      $ref: './components/schemas/auth.yaml#/OtpRequestSuccessResponse'
    AuthTokenSuccessResponse:
      $ref: './components/schemas/auth.yaml#/AuthTokenSuccessResponse'
    UserProfileSuccessResponse:
      $ref: './components/schemas/auth.yaml#/UserProfileSuccessResponse'
    Category:
      $ref: './components/schemas/fleet.yaml#/Category'
    FleetAsset:
      $ref: './components/schemas/fleet.yaml#/FleetAsset'
    CreateFleetRequest:
      $ref: './components/schemas/fleet.yaml#/CreateFleetRequest'
    CategoryListSuccessResponse:
      $ref: './components/schemas/fleet.yaml#/CategoryListSuccessResponse'
    FleetListSuccessResponse:
      $ref: './components/schemas/fleet.yaml#/FleetListSuccessResponse'
    FleetDetailSuccessResponse:
      $ref: './components/schemas/fleet.yaml#/FleetDetailSuccessResponse'
    BookingStatus:
      $ref: './components/schemas/booking.yaml#/BookingStatus'
    Booking:
      $ref: './components/schemas/booking.yaml#/Booking'
    CreateBookingRequest:
      $ref: './components/schemas/booking.yaml#/CreateBookingRequest'
    SubmitInspectionRequest:
      $ref: './components/schemas/booking.yaml#/SubmitInspectionRequest'
    InspectionRecord:
      $ref: './components/schemas/booking.yaml#/InspectionRecord'
    BookingListSuccessResponse:
      $ref: './components/schemas/booking.yaml#/BookingListSuccessResponse'
    BookingDetailSuccessResponse:
      $ref: './components/schemas/booking.yaml#/BookingDetailSuccessResponse'
    InspectionDetailSuccessResponse:
      $ref: './components/schemas/booking.yaml#/InspectionDetailSuccessResponse'
    OwnerWallet:
      $ref: './components/schemas/wallet.yaml#/OwnerWallet'
    WalletTransaction:
      $ref: './components/schemas/wallet.yaml#/WalletTransaction'
    PaymentInitiateResult:
      $ref: './components/schemas/wallet.yaml#/PaymentInitiateResult'
    PaymentInitiateSuccessResponse:
      $ref: './components/schemas/wallet.yaml#/PaymentInitiateSuccessResponse'
    WalletSuccessResponse:
      $ref: './components/schemas/wallet.yaml#/WalletSuccessResponse'
    WalletTransactionListSuccessResponse:
      $ref: './components/schemas/wallet.yaml#/WalletTransactionListSuccessResponse'
    CountryConfig:
      $ref: './components/schemas/admin.yaml#/CountryConfig'
    UpdateCountryConfigRequest:
      $ref: './components/schemas/admin.yaml#/UpdateCountryConfigRequest'
    CountryConfigListSuccessResponse:
      $ref: './components/schemas/admin.yaml#/CountryConfigListSuccessResponse'
    CountryConfigDetailSuccessResponse:
      $ref: './components/schemas/admin.yaml#/CountryConfigDetailSuccessResponse'
    AdminUiConfig:
      $ref: './components/schemas/admin.yaml#/AdminUiConfig'
    AdminUiConfigSuccessResponse:
      $ref: './components/schemas/admin.yaml#/AdminUiConfigSuccessResponse'
