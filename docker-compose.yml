services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    container_name: dink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dink_machinery_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d dink_machinery_dev" ]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:9.1.3-alpine3.24
    container_name: dink-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    command: valkey-server --save 60 1 --loglevel notice
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: dink-seaweedfs
    restart: unless-stopped
    command: "server -dir=/data -s3 -s3.port=9000"
    ports:
      - "9000:9000"
      - "8888:8888"
      - "9333:9333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/" ]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:latest
    container_name: dink-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    healthcheck:
      test: [ "CMD-SHELL", "clamdscan /init || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres-data:
    driver: local
  valkey-data:
    driver: local
  seaweedfs-data:
    driver: local
