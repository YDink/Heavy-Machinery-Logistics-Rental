commit-msg:
  commands:
    commitlint:
      run: pnpm dlx commitlint --config .github/commitlint.config.js --edit {1}

pre-commit:
  parallel: false
  commands:
    verify-context-staged:
      run: bash scripts/verify-context-staged.sh

    verify-decision-links:
      run: bash scripts/validate-decision-links.sh

    verify-decision-template:
      run: bash scripts/validate-decision-template.sh

    spectral-openapi-lint:
      glob: "contracts/**/*.yaml"
      run: pnpm --dir admin run bundle:contract && pnpm dlx @stoplight/spectral-cli lint contracts/openapi.bundled.yaml --ruleset .spectral.yaml
